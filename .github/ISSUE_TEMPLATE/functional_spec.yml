name: 기능 명세
description: moov 앱의 기능 요구사항(FR)을 명세하여 등록하세요.
title: "[FR-] "
labels: [functional-spec]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        유즈케이스를 화면/기능 단위로 분해한 기능 요구사항을 작성합니다.
        `docs/functional-spec.md`에 정리된 내용을 기반으로 등록해 주세요.
  - type: textarea
    id: overview
    attributes:
      label: 기능 개요
      description: 이 기능이 무엇인지 한두 문장으로 요약
      placeholder: 예) 운동 세션을 생성/조회/수정/삭제한다.
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 상세 요구사항
      description: 구체적인 동작/제약 조건을 나열
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 수용 기준
      description: Given/When/Then 형식으로 완료 판단 기준을 작성
      placeholder: |
        Given ..., When ..., Then ...
    validations:
      required: true
  - type: textarea
    id: data_model
    attributes:
      label: 연관 데이터 모델
      description: 관련된 SwiftData 엔티티/필드
      placeholder: 예) WorkoutSession, ExerciseBlock
    validations:
      required: false
  - type: textarea
    id: related_uc
    attributes:
      label: 연관 유즈케이스
      description: 관련된 UC 이슈 번호나 링크
      placeholder: 예) UC-01
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 중복 기능 명세를 검색했습니다
          required: true
        - label: docs/functional-spec.md 내용과 일치합니다
          required: true
